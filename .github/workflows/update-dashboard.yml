name: Atualizar dashboard pelo XML

on:
  schedule:
    # Goiânia/São Paulo UTC-3: 06h, 13h e 23h = 09h, 16h e 02h UTC
    - cron: '0 9,16,2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Gerar dashboard
        run: python scripts/generate_dashboard.py
      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html manifest.webmanifest sw.js vercel.json sitecheck/imoveis_marcusbeda.json sitecheck/imoveis_marcusbeda.csv sitecheck/feed_vivareal_marcusbeda.xml
          if git diff --cached --quiet; then
            echo "Sem mudanças"
          else
            git commit -m "Atualiza dashboard pelo XML oficial"
            git push
          fi
